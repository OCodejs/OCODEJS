stages:
  - build_and_test
  - deploy

# Bước 1: Cài đặt thư viện, chạy test và build code
build_job:
  stage: build_and_test
  # Thay image ở dòng dưới theo bảng trên (ví dụ: python:3.11-slim, php:8.2-cli...)
  image: node:20-alpine
  script:
    # Thay bằng lệnh cài đặt và build của ngôn ngữ bạn dùng
    - npm ci
    - npm run build
  only:
    - main

# Bước 2: Tự động SSH vào VPS để kéo code mới và khởi động lại dịch vụ
deploy_vps:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
  script:
    - ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_SERVER_IP "
        cd /duong/dan/thu/muc/du/an &&
        git pull origin main &&
        # Thay bằng lệnh restart app trên VPS của bạn (vd: pm2 restart all, docker-compose up -d --build, systemctl restart...)
        pm2 restart all
      "
  only:
    - main
