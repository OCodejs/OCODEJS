name: Validate GitHub Pages Jekyll build

on:
  pull_request:
    branches: [main]
    paths:
      - "_config.yml"
      - "docs/content/**"
      - ".github/workflows/jekyll-preview.yml"
  push:
    branches:
      - "fix/jekyll-exclude-github-docs-content-20261117"

permissions:
  contents: read

concurrency:
  group: jekyll-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build with GitHub Pages Jekyll image
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site
      - name: Verify build artifact
        run: test -d _site
