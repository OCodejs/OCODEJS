name: Refresh npm lockfiles

on:
  push:
    branches:
      - fix/ci-deployment-green-20261105

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/ci-deployment-green-20261105
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh root lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: Refresh Cloud Agent lockfile
        working-directory: apps/cloud-agent
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: Commit updated lockfiles
        run: |
          if git diff --quiet -- package-lock.json apps/cloud-agent/package-lock.json; then
            echo "Lockfiles are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json apps/cloud-agent/package-lock.json
          git commit -m "chore(deps): refresh npm lockfiles and security patches"
          git push origin HEAD:fix/ci-deployment-green-20261105
