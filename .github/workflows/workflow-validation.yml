name: Workflow Config Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  run-lint:
    name: run-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Parse all workflow YAML files
        run: |
          ruby - <<'RUBY'
          require "yaml"
          Dir.glob(".github/workflows/*.{yml,yaml}").sort.each do |path|
            YAML.parse_file(path)
            puts "Validated #{path}"
          end
          RUBY
