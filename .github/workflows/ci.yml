name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and run tests
        run: npm test
      - name: Generate API coverage report
        run: npm run test:coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ocode-js-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14
      - name: Validate npm package contents
        run: npm pack --dry-run
      - name: Check npm package registry metadata
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const pkg = JSON.parse(await readFile('package.json', 'utf8'));
          const response = await fetch(
            `https://registry.npmjs.org/${encodeURIComponent(pkg.name)}`
          );

          if (response.status === 404) {
            console.log(`Package name "${pkg.name}" is not registered yet.`);
            process.exit(0);
          }

          if (!response.ok) {
            throw new Error(`npm registry check failed: HTTP ${response.status}`);
          }

          const metadata = await response.json();
          if (metadata.versions?.[pkg.version]) {
            console.log(`${pkg.name}@${pkg.version} is already published; CI validation will not attempt to republish it.`);
          } else {
            console.log(`${pkg.name} is registered; version ${pkg.version} is not published yet.`);
          }
          NODE
      - name: Smoke-test built entry point
        run: |
          node --input-type=module <<'NODE'
          const m = await import('./dist/index.js');
          for (const name of ['slugify', 'retry', 'fetchJson', 'readStorage', 'createLogger']) {
            if (!(name in m)) throw new Error(`Missing public export: ${name}`);
          }
          console.log('Public entry point exports verified.');
          NODE
