<issue_to_address>
**Mutable linter reference exposes token**

When the upstream `v4` tag is moved or compromised, gitHub resolves `@v4` to the changed action code, which runs with `secrets.GITHUB_TOKEN` in its environment and can exfiltrate the token or exercise its granted permissions.

Pin Super-Linter to a reviewed full commit SHA and explicitly grant only the token permissions it needs.
</issue_to_address>

