name: Dependency review

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch or commit to compare
        required: true
        default: main
        type: string
      head_ref:
        description: Head branch or commit to compare
        required: true
        default: fix/ci-deployment-green-complete
        type: string

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          base-ref: ${{ inputs.base_ref }}
          head-ref: ${{ inputs.head_ref }}
          comment-summary-in-pr: never
