name: OCodeJS Bot — PR Review Signal

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]

# No secrets, no repository permissions, no checkout, and no PR-code execution.
permissions: {}

concurrency:
  group: ocodejs-bot-signal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signal:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record unprivileged review signal
        run: |
          {
            echo "## OCodeJS Bot review signal"
            echo "This run contains no secrets and does not check out or execute pull-request code."
            echo "The trusted publisher independently validates the PR and fetches its diff through the GitHub API."
          } >> "$GITHUB_STEP_SUMMARY"
